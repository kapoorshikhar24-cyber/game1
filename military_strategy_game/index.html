<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Military Strategy Game - Prototype</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Top Bar -->
        <div id="top-bar">
            <div id="turn-info">Turn <span id="turn-counter">01</span></div>
            <div id="turn-phase">PLAYER TURN</div>
            <div id="objective-info">Objective: Capture Base</div>
        </div>

        <!-- Main Map Area -->
        <div id="map-area">
            <canvas id="game-canvas"></canvas>
        </div>

        <!-- Bottom HUD -->
        <div id="hud">
            <div id="unit-info-panel">
                <div id="no-selection">Select a unit</div>
                <div id="unit-details" class="hidden">
                    <h3 id="ui-unit-name">Infantry</h3>
                    <div class="stat-bar-container">
                        <span>HP</span>
                        <div class="stat-bar"><div id="ui-hp-fill" class="fill hp"></div></div>
                        <span id="ui-hp-text">100/100</span>
                    </div>
                    <div class="stats">
                        <div>MP: <span id="ui-mp">4/4</span></div>
                        <div>Attack: <span id="ui-attack">25</span></div>
                        <div>Range: <span id="ui-range">1</span></div>
                        <div>Defense: <span id="ui-defense">10</span></div>
                    </div>
                </div>
            </div>

            <div id="action-panel">
                <button id="btn-move" class="action-btn" disabled>MOVE</button>
                <button id="btn-attack" class="action-btn" disabled>ATTACK</button>
                <button id="btn-capture" class="action-btn" disabled>CAPTURE</button>
                <button id="btn-end-turn" class="action-btn primary">END TURN</button>
            </div>
        </div>
        
        <!-- Screens -->
        <div id="screen-overlay" class="hidden">
            <div class="screen-content">
                <h1 id="screen-title">VICTORY</h1>
                <p id="screen-desc">Enemy base captured.</p>
                <button id="btn-restart">RESTART</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/map.js"></script>
    <script src="js/units.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
